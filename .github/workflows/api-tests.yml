name: API & pricing tests

on:
  push:
    branches: [main]
    paths:
      - "packages/pricing/**"
      - "services/api/**"
      - "seeds/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e packages/pricing -r services/api/requirements.txt
      - name: Test
        run: python -m pytest packages/pricing/tests services/api/tests -q
